<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dynasties">
<meta name="theme-color" content="#182014">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Dynasties — Mechanics Build v7</title>
<style>
:root{
  --blue:#315f9b; --red:#93433d; --gold:#d7b96e; --cream:#f3e4bd;
  --grass-a:#76a94d; --grid:#5d873c;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  min-height:100dvh;
  overflow:hidden;
  background:#151910;
  font-family:Georgia,"Times New Roman",serif;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;overscroll-behavior:none;
}
button{font:inherit}
#game{
  width:100vw;
  height:var(--app-height,100dvh);
  min-height:var(--app-height,100dvh);
  display:grid;
  grid-template-rows:auto 1fr auto;
  background:#151910;
}
#topbar{
  position:relative;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;
  min-height:68px;padding:calc(5px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 5px calc(8px + env(safe-area-inset-left));
  background:linear-gradient(#241a12,#16110c);border-bottom:3px solid #8b6735;color:var(--cream);
}
.team{min-width:0;display:flex;align-items:center;gap:10px}
.team.enemy{justify-content:flex-end;text-align:right}
.crest{
  flex:0 0 42px;width:42px;height:48px;display:grid;place-items:center;
  border:2px solid var(--gold);border-radius:5px 5px 14px 14px;font-weight:bold;font-size:22px;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.2)
}
.player .crest{background:var(--blue)}
.enemy .crest{background:var(--red)}
.teamName{font-size:18px;font-weight:bold;white-space:nowrap}
.econ{font-size:13px;color:#d7c79d;white-space:nowrap}
.econ b{color:#fff0c4}
.income{color:#8bd477}
#turnBox{text-align:center;min-width:128px}
#turnLabel{font-size:13px;color:#cbb889}
#turnNo{font-size:22px;font-weight:bold;color:#fff0c4}
#endTurn{
  margin-top:3px;min-width:116px;min-height:38px;padding:7px 12px;color:#fff0c7;
  background:linear-gradient(#70402f,#4b281f);border:2px solid #d1aa61;border-radius:5px;font-weight:bold;
}

#fieldViewport{
  position:relative;
  min-height:0;
  overflow:hidden;
  background:#222c19;
  touch-action:none;
  cursor:grab;
}
#fieldViewport.dragging{cursor:grabbing}
#mapControls{
  position:absolute;
  right:calc(8px + env(safe-area-inset-right));
  top:8px;
  z-index:30;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.mapBtn{
  width:46px;height:46px;min-width:46px;min-height:46px;padding:0;border-radius:50%;
  color:#fff0c7;background:rgba(25,20,15,.90);border:2px solid #c9a15b;
  box-shadow:0 4px 12px rgba(0,0,0,.35);font:bold 22px Georgia,serif;
}
#focusMap{font-size:19px}

#board{
  position:absolute;left:0;top:0;width:1280px;height:1280px;transform-origin:0 0;touch-action:none;
}
#grass{
  position:absolute;inset:0;display:grid;grid-template-columns:repeat(20,64px);grid-template-rows:repeat(20,64px);
  border:3px solid #3e5f2a;box-shadow:0 8px 24px rgba(0,0,0,.34);background:var(--grass-a);
}
.grassCell{
  position:relative;width:64px;height:64px;border-right:1px solid rgba(71,116,44,.42);border-bottom:1px solid rgba(71,116,44,.42);
  background-image:url('./assets/grass_tile.png');background-size:64px 64px;background-repeat:no-repeat;image-rendering:pixelated;
}
.grassCell.alt{background-image:url('./assets/grass_tile.png')}

#overlay{position:absolute;inset:0;z-index:4;pointer-events:none}
.moveCell,.attackCell,.pathCell{position:absolute;width:64px;height:64px;pointer-events:auto}
.moveCell{background:rgba(88,188,255,.26);box-shadow:inset 0 0 0 3px rgba(177,228,255,.86)}
.pathCell{background:rgba(255,225,107,.24);box-shadow:inset 0 0 0 3px rgba(255,238,153,.9)}
.attackCell{background:rgba(231,77,67,.27);box-shadow:inset 0 0 0 3px rgba(255,205,196,.92)}
#objectLayer,#unitLayer{position:absolute;inset:0;z-index:6;pointer-events:none}

.barracks{
  position:absolute;width:58px;height:58px;transform:translate(3px,3px);display:grid;place-items:center;
  pointer-events:auto;border:3px solid #e3cc95;border-radius:7px;color:#fff4d6;font:bold 24px Georgia,serif;
  box-shadow:0 4px 8px rgba(0,0,0,.35), inset 0 0 0 3px rgba(0,0,0,.18);
}
.barracks.player{background:#315f9b}
.barracks.enemy{background:#93433d}
.barracks.selected{outline:4px solid #ffe98c;outline-offset:3px}
.barracks .tiny{
  position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:2px 5px;
  background:rgba(25,18,12,.9);border:1px solid #9e7b45;font:10px "Courier New",monospace;
}

.unit{
  position:absolute;width:62px;height:76px;transform:translate(1px,-13px);pointer-events:auto;
  transition:left .13s linear,top .13s linear;
  padding:0;margin:0;border:0;outline:0;background:transparent;box-shadow:none;
  appearance:none;-webkit-appearance:none;overflow:visible;
}
.unit img{
  width:100%;height:100%;object-fit:contain;image-rendering:pixelated;
  filter:drop-shadow(0 4px 2px rgba(0,0,0,.35));pointer-events:none;transform-origin:center center;
}
.unit.selected::after{
  content:"";position:absolute;left:8px;right:8px;bottom:4px;height:10px;border:3px solid #fff0a2;border-radius:50%;
  box-shadow:0 0 0 2px rgba(45,106,176,.95);
}
.unit.enemy.selected::after{box-shadow:0 0 0 2px rgba(152,53,45,.95)}
.unit.done{filter:saturate(.6) brightness(.77)}
.unit.dead{display:none}
.hp{position:absolute;left:7px;top:1px;width:48px;height:7px;background:#3c1814;border:1px solid #f0d7a8;z-index:3}
.hpFill{height:100%;background:#58ae53}

#bottom{
  position:relative;z-index:20;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;
  min-height:88px;padding:7px calc(8px + env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
  color:var(--cream);background:linear-gradient(#1b140e,#0e0b08);border-top:3px solid #8b6735;
}
#info{min-width:0;display:flex;gap:12px;align-items:center}
#portrait{flex:0 0 58px;width:58px;height:68px;display:grid;place-items:center;border:2px solid #caa45d;background:#2b2118;overflow:hidden}
#portrait img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated}
#infoText{min-width:0}
#selectedName{font-size:18px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#selectedSub{font-size:11px;color:#baa87f;margin:2px 0 4px}
#stats{display:flex;gap:12px;font-size:12px;white-space:nowrap;flex-wrap:wrap}
#status{margin-top:4px;font-size:11px;color:#e2cfa2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.action{
  min-width:86px;min-height:48px;padding:7px 10px;color:#fff0c7;background:linear-gradient(#31465d,#1e2d3e);
  border:2px solid #bd9957;border-radius:5px;font-weight:bold;
}
.action:disabled{opacity:.45}
#newGame{min-width:56px;font-size:11px}

#rotate{display:none}

/* Portrait-first iPhone layout */
@media(max-width:600px) and (orientation:portrait){
  #topbar{
    min-height:88px;grid-template-columns:1fr 94px 1fr;gap:4px;
    padding:calc(5px + env(safe-area-inset-top)) calc(5px + env(safe-area-inset-right)) 5px calc(5px + env(safe-area-inset-left));
  }
  .team{gap:5px}
  .crest{width:31px;height:36px;flex-basis:31px;font-size:16px;border-width:1px}
  .teamName{font-size:13px}
  .econ{font-size:9px;white-space:normal;line-height:1.2}
  #turnBox{min-width:88px}
  #turnLabel{font-size:9px}
  #turnNo{font-size:17px}
  #endTurn{min-width:86px;min-height:38px;padding:5px 6px;font-size:12px}

  #bottom{
    min-height:154px;
    grid-template-columns:1fr;
    gap:5px;
    padding:
      6px
      calc(7px + env(safe-area-inset-right))
      calc(24px + env(safe-area-inset-bottom))
      calc(7px + env(safe-area-inset-left));
  }
  #info{gap:8px;align-items:flex-start}
  #portrait{width:54px;height:62px;flex-basis:54px}
  #selectedName{font-size:16px}
  #selectedSub{font-size:10px}
  #stats{display:grid;grid-template-columns:repeat(3,auto);gap:3px 10px;font-size:11px}
  #status{margin-top:3px;font-size:10px;white-space:normal;line-height:1.2;max-height:28px}
  #actions{justify-content:flex-end}
  .action{min-height:40px;padding:5px 8px;font-size:11px}
  #newGame{min-width:70px}

  #mapControls{top:8px;right:calc(7px + env(safe-area-inset-right))}
  .mapBtn{width:44px;height:44px;min-width:44px;min-height:44px}
}
@media(max-width:1000px) and (max-height:600px) and (orientation:landscape){
  #topbar{min-height:58px;padding-top:calc(3px + env(safe-area-inset-top));padding-bottom:3px}
  .crest{width:34px;height:39px;flex-basis:34px;font-size:18px}
  .teamName{font-size:15px}.econ{font-size:11px}
  #turnBox{min-width:112px}#turnLabel{font-size:10px}#turnNo{font-size:18px}
  #endTurn{min-height:34px;min-width:104px;padding:4px 9px;font-size:13px}
  #bottom{min-height:82px;padding-top:5px}
  #portrait{width:50px;height:58px;flex-basis:50px}
  #selectedName{font-size:16px}#selectedSub{font-size:10px}
  #stats{font-size:11px;gap:8px}
  #status{font-size:10px}
  .action{min-width:82px;min-height:44px;padding:5px 8px;font-size:12px}
}
</style>
</head>
<body>
<div id="game">
  <div id="topbar">
    <div class="team player">
      <div class="crest">B</div>
      <div>
        <div class="teamName">Team Blue</div>
        <div class="econ"><b id="pGold">300</b> florins · <span class="income">+100/turn</span> · <span id="pCount">1</span> units</div>
      </div>
    </div>

    <div id="turnBox">
      <div id="turnLabel">TURN</div>
      <div id="turnNo">1</div>
      <button id="endTurn" type="button">End Turn</button>
    </div>

    <div class="team enemy">
      <div>
        <div class="teamName">Team Red</div>
        <div class="econ"><span id="eCount">1</span> units · <span class="income">+100/turn</span> · <b id="eGold">300</b> florins</div>
      </div>
      <div class="crest">R</div>
    </div>
  </div>

  <div id="fieldViewport">
    <div id="mapControls">
      <button class="mapBtn" id="zoomIn" type="button" aria-label="Zoom in">+</button>
      <button class="mapBtn" id="zoomOut" type="button" aria-label="Zoom out">−</button>
      <button class="mapBtn" id="focusMap" type="button" aria-label="Recenter map">◎</button>
    </div>
    <div id="board">
      <div id="grass"></div>
      <div id="overlay"></div>
      <div id="objectLayer">
        <button class="barracks player" id="barracks-player" type="button" aria-label="Blue Barracks">B<span class="tiny">BLUE</span></button>
        <button class="barracks enemy" id="barracks-enemy" type="button" aria-label="Red Barracks">B<span class="tiny">RED</span></button>
      </div>
      <div id="unitLayer"></div>
    </div>
  </div>

  <div id="bottom">
    <div id="info">
      <div id="portrait"><img id="portraitImg" src="./assets/team_blue_soldier.png" alt=""></div>
      <div id="infoText">
        <div id="selectedName">Blue Soldier 1</div>
        <div id="selectedSub">Soldier · Team Blue</div>
        <div id="stats">
          <span>HP <b id="statHP">8/8</b></span>
          <span>ATK <b id="statAtk">3</b></span>
          <span>DEF <b id="statDef">2</b></span>
          <span>MOV <b id="statMov">2/2</b></span>
          <span>RNG <b id="statRng">1</b></span>
          <span>ATK USED <b id="statAttack">No</b></span>
        </div>
        <div id="status">Select a unit, move on blue tiles, then attack a red unit within its range.</div>
      </div>
    </div>
    <div id="actions">
      <button class="action" id="recruitSoldier" type="button" hidden>Recruit Soldier · 300</button>
      <button class="action" id="recruitArcher" type="button" hidden>Recruit Archer · 400</button>
      <button class="action" id="newGame" type="button">New Game</button>
    </div>
  </div>
</div>

<script>
(() => {
  const COLS=20, ROWS=20, CELL=64;
  const SAVE_KEY='dynasties-mechanics-v7';
  const UNIT_DEFS={
    soldier:{label:'Soldier',cost:300,hp:8,atk:3,def:2,maxMove:2,minRange:1,maxRange:1},
    archer:{label:'Archer',cost:400,hp:8,atk:3,def:1,maxMove:2,minRange:1,maxRange:3}
  };

  const state={
    turn:1,selectedUnitId:'blue-1',selectedBarracks:null,busy:false,nextRecruitId:2,
    mapZoom:.52,mapX:0,mapY:0,dragging:false,dragMoved:false,dragStartX:0,dragStartY:0,
    mapStartX:0,mapStartY:0,pointers:new Map(),pinching:false,pinchStartDist:0,pinchStartZoom:.52,
    pinchMapX:0,pinchMapY:0
  };
  const teams={
    player:{name:'Team Blue',gold:300,income:100,recruited:false},
    enemy:{name:'Team Red',gold:300,income:100,recruited:false}
  };
  const barracks={
    player:{x:9,y:17,spawn:[{x:9,y:16},{x:10,y:16},{x:10,y:17},{x:10,y:18},{x:9,y:18},{x:8,y:18},{x:8,y:17},{x:8,y:16}]},
    enemy:{x:9,y:2,spawn:[{x:9,y:3},{x:10,y:3},{x:10,y:2},{x:10,y:1},{x:9,y:1},{x:8,y:1},{x:8,y:2},{x:8,y:3}]}
  };

  let units={};
  function resetUnits(){
    units={
      'blue-1':createUnit('player','soldier','blue-1',9,15,false,'right'),
      'red-1':createUnit('enemy','soldier','red-1',9,4,false,'left')
    };
  }

  function createUnit(team,kind,id,x,y,recruited=false,facing=null){
    const def=UNIT_DEFS[kind];
    const prefix=team==='player'?'Blue':'Red';
    const num=id==='blue-1'||id==='red-1' ? '1' : id.split('-').pop();
    return {
      id,team,kind,
      name:`${prefix} ${def.label} ${num}`,
      title:`${def.label} · Team ${prefix}`,
      x,y,
      hp:def.hp,maxHp:def.hp,atk:def.atk,def:def.def,
      move:recruited?0:def.maxMove,maxMove:def.maxMove,
      minRange:def.minRange,maxRange:def.maxRange,
      attacked:!!recruited,alive:true,
      facing:facing || (team==='player'?'right':'left')
    };
  }
  resetUnits();

  const grass=document.getElementById('grass');
  const overlay=document.getElementById('overlay');
  const unitLayer=document.getElementById('unitLayer');
  const board=document.getElementById('board');
  const fieldViewport=document.getElementById('fieldViewport');

  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const c=document.createElement('div');
      c.className='grassCell'+(((x+y)%2)?' alt':'');
      c.addEventListener('click',()=>onTileClick(x,y));
      c.addEventListener('pointerenter',()=>previewPath(x,y));
      grass.appendChild(c);
    }
  }

  const key=(x,y)=>`${x},${y}`;
  const inside=(x,y)=>x>=0&&x<COLS&&y>=0&&y<ROWS;
  const manhattan=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
  const living=team=>Object.values(units).filter(u=>u.team===team&&u.alive);
  const unitAt=(x,y)=>Object.values(units).find(u=>u.alive&&u.x===x&&u.y===y)||null;
  const barracksAt=(x,y)=>Object.values(barracks).find(b=>b.x===x&&b.y===y)||null;
  const selectedUnit=()=>state.selectedUnitId?units[state.selectedUnitId]:null;
  const inRange=(attacker,target)=>{
    const d=manhattan(attacker,target);
    return d>=attacker.minRange && d<=attacker.maxRange;
  };
  const rangeLabel=u=>u.minRange===u.maxRange?`${u.maxRange}`:`${u.minRange}-${u.maxRange}`;

  const spriteFor=u=>{
    if(u.kind==='archer'){
      return u.team==='player'?'./assets/team_blue_archer.png':'./assets/team_red_archer.png';
    }
    return u.team==='player'?'./assets/team_blue_soldier.png':'./assets/team_red_soldier.png';
  };

  function ensureUnitEl(u){
    let el=document.getElementById('unit-'+u.id);
    if(el)return el;
    el=document.createElement('button');
    el.type='button';
    el.id='unit-'+u.id;
    el.className='unit '+(u.team==='enemy'?'enemy':'player');
    el.setAttribute('aria-label',u.name);
    el.innerHTML='<div class="hp"><div class="hpFill"></div></div><img alt="">';
    el.querySelector('img').src=spriteFor(u);
    el.querySelector('img').alt=u.name;
    el.addEventListener('click',e=>{
      e.stopPropagation();
      if(state.busy||!u.alive)return;
      if(u.team==='player'){
        selectUnit(u.id);
      }else{
        const attacker=selectedUnit();
        if(attacker&&attacker.team==='player'&&attacker.alive&&inRange(attacker,u)) attack(attacker,u);
        else setStatus(`${u.name} is out of attack range.`);
      }
    });
    unitLayer.appendChild(el);
    return el;
  }

  function positionStaticObjects(){
    const p=document.getElementById('barracks-player');
    const e=document.getElementById('barracks-enemy');
    p.style.left=(barracks.player.x*CELL)+'px'; p.style.top=(barracks.player.y*CELL)+'px';
    e.style.left=(barracks.enemy.x*CELL)+'px'; e.style.top=(barracks.enemy.y*CELL)+'px';
  }
  function setUnitPos(u){
    const el=ensureUnitEl(u);
    el.style.left=(u.x*CELL)+'px';
    el.style.top=(u.y*CELL)+'px';
    if(!u.facing)u.facing=(u.team==='player'?'right':'left');
    const img=el.querySelector('img');
    img.style.transform=(u.facing==='left'?'scaleX(-1)':'scaleX(1)');
  }
  function faceTowardStep(u,step){
    if(step.x>u.x)u.facing='right';
    else if(step.x<u.x)u.facing='left';
  }

  function dijkstra(u,maxCost){
    const best=new Map([[key(u.x,u.y),0]]);
    const prev=new Map();
    const q=[{x:u.x,y:u.y,c:0}];
    while(q.length){
      q.sort((a,b)=>a.c-b.c);
      const cur=q.shift();
      const ck=key(cur.x,cur.y);
      if(cur.c!==best.get(ck))continue;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=cur.x+dx, ny=cur.y+dy;
        if(!inside(nx,ny)||barracksAt(nx,ny))continue;
        const occ=unitAt(nx,ny);
        if(occ&&occ.id!==u.id)continue;
        const nc=cur.c+1;
        if(nc>maxCost)continue;
        const nk=key(nx,ny);
        if(!best.has(nk)||nc<best.get(nk)){ best.set(nk,nc); prev.set(nk,ck); q.push({x:nx,y:ny,c:nc}); }
      }
    }
    return {best,prev};
  }

  function reconstruct(prev,start,target){
    const sk=key(start.x,start.y), tk=key(target.x,target.y);
    if(tk===sk)return [];
    if(!prev.has(tk))return null;
    const rev=[tk];
    let cur=tk;
    while(cur!==sk){ cur=prev.get(cur); if(!cur)return null; rev.push(cur); }
    rev.reverse();
    return rev.slice(1).map(k=>{ const [x,y]=k.split(',').map(Number); return {x,y}; });
  }

  function clearOverlay(){ overlay.innerHTML=''; }
  function addOverlayCell(x,y,cls,onClick){
    const c=document.createElement('div');
    c.className=cls; c.style.left=(x*CELL)+'px'; c.style.top=(y*CELL)+'px';
    if(onClick)c.addEventListener('click',e=>{ e.stopPropagation(); onClick(); });
    overlay.appendChild(c);
  }

  function updateHighlights(){
    clearOverlay();
    const u=selectedUnit();
    if(!u||!u.alive||u.team!=='player'||state.busy||state.selectedBarracks)return;
    const data=dijkstra(u,u.move);
    for(const [k,cost] of data.best.entries()){
      if(cost===0)continue;
      const [x,y]=k.split(',').map(Number);
      addOverlayCell(x,y,'moveCell',()=>moveSelectedTo(x,y));
    }
    if(!u.attacked){
      living('enemy').forEach(e=>{ if(inRange(u,e)) addOverlayCell(e.x,e.y,'attackCell',()=>attack(u,e)); });
    }
  }

  function previewPath(x,y){
    const u=selectedUnit();
    if(!u||state.busy||state.selectedBarracks)return;
    const data=dijkstra(u,u.move);
    if(!data.best.has(key(x,y)))return;
    updateHighlights();
    const path=reconstruct(data.prev,u,{x,y})||[];
    path.forEach(p=>addOverlayCell(p.x,p.y,'pathCell',()=>moveSelectedTo(x,y)));
  }

  async function moveSelectedTo(x,y){
    const u=selectedUnit();
    if(!u||state.busy||state.selectedBarracks)return;
    const data=dijkstra(u,u.move);
    if(!data.best.has(key(x,y)))return;
    const path=reconstruct(data.prev,u,{x,y});
    if(!path||!path.length)return;
    state.busy=true; clearOverlay();
    for(const step of path){
      faceTowardStep(u,step);
      u.move=Math.max(0,u.move-1);
      u.x=step.x; u.y=step.y;
      setUnitPos(u);
      await new Promise(r=>setTimeout(r,130));
    }
    state.busy=false;
    setStatus(`${u.name} moved ${path.length} tile${path.length===1?'':'s'}.`);
    updateAll();
  }

  function onTileClick(x,y){
    if(state.busy)return;
    const u=unitAt(x,y);
    if(u){ if(u.team==='player') selectUnit(u.id); return; }
    if(barracksAt(x,y)){
      const team=(barracks.player.x===x&&barracks.player.y===y)?'player':'enemy';
      selectBarracks(team);
    }
  }

  const damage=(a,d)=>Math.max(1,a.atk-Math.floor(d.def/2));

  function attack(a,d){
    if(state.busy||!a.alive||!d.alive||!inRange(a,d))return;
    if(a.attacked){ setStatus(`${a.name} has already attacked this turn.`); return; }
    const dmg=damage(a,d);
    d.hp=Math.max(0,d.hp-dmg);
    a.attacked=true; a.move=0;
    setStatus(`${a.name} attacks ${d.name} for ${dmg} damage.`);
    if(d.hp<=0){ d.alive=false; setStatus(`${d.name} has fallen.`); }
    updateAll(); checkGameOver();
  }

  function selectUnit(id){
    const u=units[id];
    if(!u||!u.alive||u.team!=='player'||state.busy)return;
    state.selectedUnitId=id; state.selectedBarracks=null;
    setStatus(`${u.name} selected.`);
    updateAll();
  }
  function selectBarracks(team){
    if(state.busy)return;
    state.selectedUnitId=null; state.selectedBarracks=team;
    setStatus(team==='player'?'Blue Barracks selected.':'Red Barracks selected.');
    updateAll();
  }

  function nextSpawn(team){
    return barracks[team].spawn.find(p=>inside(p.x,p.y)&&!unitAt(p.x,p.y)&&!barracksAt(p.x,p.y))||null;
  }

  function recruit(team,kind='soldier',announce=true){
    const t=teams[team];
    const def=UNIT_DEFS[kind];
    if(t.gold<def.cost||t.recruited)return null;
    const spawn=nextSpawn(team);
    if(!spawn)return null;
    t.gold-=def.cost; t.recruited=true;
    const n=state.nextRecruitId++;
    const id=`${team}-${kind}-${n}`;
    units[id]=createUnit(team,kind,id,spawn.x,spawn.y,true);
    ensureUnitEl(units[id]);
    const prefix=team==='player'?'Blue':'Red';
    if(announce)setStatus(`${prefix} recruits an ${def.label.toLowerCase()} for ${def.cost} florins. It can act next turn.`);
    updateAll();
    return units[id];
  }

  function nearestTarget(enemy){
    return living('player').slice().sort((a,b)=>{
      const da=Math.min(manhattan(enemy,a), enemy.maxRange) - Math.min(manhattan(enemy,b), enemy.maxRange);
      if(da!==0)return da;
      return a.hp-b.hp;
    })[0]||null;
  }

  function routeTowardAttackPosition(unit,target){
    const data=dijkstra(unit,999);
    let bestTile=null, bestCost=Infinity, bestDist=Infinity;

    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        if((x===unit.x && y===unit.y) || barracksAt(x,y)) continue;
        const occ=unitAt(x,y);
        if(occ && occ.id!==unit.id) continue;
        const dist=manhattan({x,y},target);
        if(dist<unit.minRange || dist>unit.maxRange) continue;
        const cost=data.best.get(key(x,y));
        if(cost===undefined) continue;
        if(cost<bestCost || (cost===bestCost && dist<bestDist)){
          bestCost=cost; bestDist=dist; bestTile={x,y};
        }
      }
    }

    if(!bestTile)return [];
    const full=reconstruct(data.prev,unit,bestTile)||[];
    return full.slice(0,unit.move);
  }

  function chooseEnemyRecruitType(){
    const archers=living('enemy').filter(u=>u.kind==='archer').length;
    const soldiers=living('enemy').filter(u=>u.kind==='soldier').length;
    if(teams.enemy.gold>=UNIT_DEFS.archer.cost && archers<soldiers) return 'archer';
    if(teams.enemy.gold>=UNIT_DEFS.archer.cost && Math.random()<0.35) return 'archer';
    return 'soldier';
  }

  async function enemyPhase(){
    state.busy=true; updateAll(); setStatus('Team Red turn…');

    if(!teams.enemy.recruited){
      const recruitType=chooseEnemyRecruitType();
      const cost=UNIT_DEFS[recruitType].cost;
      if(teams.enemy.gold>=cost){
        const nu=recruit('enemy',recruitType,false);
        if(nu){
          setStatus(`Team Red recruits a ${UNIT_DEFS[recruitType].label.toLowerCase()}.`);
          await new Promise(r=>setTimeout(r,250));
        }
      } else if(teams.enemy.gold>=UNIT_DEFS.soldier.cost){
        const nu=recruit('enemy','soldier',false);
        if(nu){
          setStatus('Team Red recruits a soldier.');
          await new Promise(r=>setTimeout(r,250));
        }
      }
    }

    const enemies=living('enemy').slice();
    for(const enemy of enemies){
      if(!living('player').length)break;
      if(enemy.move<=0&&enemy.attacked)continue;

      let target=nearestTarget(enemy);
      if(!target)break;

      if(!inRange(enemy,target) && enemy.move>0){
        const path=routeTowardAttackPosition(enemy,target);
        for(const step of path){
          faceTowardStep(enemy,step);
          enemy.move=Math.max(0,enemy.move-1);
          enemy.x=step.x; enemy.y=step.y;
          setUnitPos(enemy);
          await new Promise(r=>setTimeout(r,125));
        }
      }

      const attackable=living('player').filter(p=>inRange(enemy,p)).sort((a,b)=>{
        if(a.hp!==b.hp)return a.hp-b.hp;
        return manhattan(enemy,a)-manhattan(enemy,b);
      });
      target=attackable[0]||null;
      if(target&&!enemy.attacked){
        const dmg=damage(enemy,target);
        target.hp=Math.max(0,target.hp-dmg);
        enemy.attacked=true; enemy.move=0;
        setStatus(`${enemy.name} attacks ${target.name} for ${dmg} damage.`);
        if(target.hp<=0)target.alive=false;
        updateAll();
        await new Promise(r=>setTimeout(r,240));
      }
    }
    state.busy=false; updateAll();
  }

  async function endTurn(){
    if(state.busy)return;
    await enemyPhase();
    if(checkGameOver())return;
    state.turn++;
    teams.player.gold+=teams.player.income;
    teams.enemy.gold+=teams.enemy.income;
    teams.player.recruited=false; teams.enemy.recruited=false;
    living('player').forEach(u=>{u.move=u.maxMove;u.attacked=false});
    living('enemy').forEach(u=>{u.move=u.maxMove;u.attacked=false});
    const first=living('player')[0]||null;
    state.selectedUnitId=first?first.id:null; state.selectedBarracks=null;
    setStatus(`Turn ${state.turn}. Both teams gain 100 florins.`);
    updateAll();
  }

  function checkGameOver(){
    if(living('enemy').length===0){ alert('Victory — Team Red has no units remaining.'); return true; }
    if(living('player').length===0){ alert('Defeat — Team Blue has no units remaining.'); return true; }
    return false;
  }

  function setStatus(msg){ document.getElementById('status').textContent=msg; }

  function updateBottomInfo(){
    const recruitSoldierBtn=document.getElementById('recruitSoldier');
    const recruitArcherBtn=document.getElementById('recruitArcher');

    if(state.selectedBarracks){
      const team=state.selectedBarracks, isBlue=team==='player', t=teams[team];
      const portrait=document.getElementById('portraitImg');
      portrait.style.display='none';
      document.getElementById('selectedName').textContent=isBlue?'Blue Barracks':'Red Barracks';
      document.getElementById('selectedSub').textContent=isBlue?'Recruitment building':'Enemy recruitment building';
      document.getElementById('statHP').textContent='—';
      document.getElementById('statAtk').textContent='—';
      document.getElementById('statDef').textContent='—';
      document.getElementById('statMov').textContent='—';
      document.getElementById('statRng').textContent='—';
      document.getElementById('statAttack').textContent='—';

      recruitSoldierBtn.hidden=!isBlue;
      recruitArcherBtn.hidden=!isBlue;

      if(isBlue){
        const noSpace=!nextSpawn('player');

        const soldierCost=UNIT_DEFS.soldier.cost;
        recruitSoldierBtn.disabled=t.gold<soldierCost||t.recruited||noSpace;
        if(t.recruited) recruitSoldierBtn.textContent='Recruited this turn';
        else if(t.gold<soldierCost) recruitSoldierBtn.textContent=`Need ${soldierCost-t.gold} more florins`;
        else if(noSpace) recruitSoldierBtn.textContent='No adjacent spawn tile';
        else recruitSoldierBtn.textContent='Recruit Soldier · 300';

        const archerCost=UNIT_DEFS.archer.cost;
        recruitArcherBtn.disabled=t.gold<archerCost||t.recruited||noSpace;
        if(t.recruited) recruitArcherBtn.textContent='Recruited this turn';
        else if(t.gold<archerCost) recruitArcherBtn.textContent=`Need ${archerCost-t.gold} more florins`;
        else if(noSpace) recruitArcherBtn.textContent='No adjacent spawn tile';
        else recruitArcherBtn.textContent='Recruit Archer · 400';
      }
      return;
    }

    recruitSoldierBtn.hidden=true;
    recruitArcherBtn.hidden=true;

    const u=selectedUnit()||living('player')[0]||null;
    if(!u)return;
    const portrait=document.getElementById('portraitImg');
    portrait.style.display='';
    portrait.src=spriteFor(u);
    document.getElementById('selectedName').textContent=u.name;
    document.getElementById('selectedSub').textContent=u.title;
    document.getElementById('statHP').textContent=`${u.hp}/${u.maxHp}`;
    document.getElementById('statAtk').textContent=u.atk;
    document.getElementById('statDef').textContent=u.def;
    document.getElementById('statMov').textContent=`${u.move}/${u.maxMove}`;
    document.getElementById('statRng').textContent=rangeLabel(u);
    document.getElementById('statAttack').textContent=u.attacked?'Yes':'No';
  }

  function save(){
    try{
      localStorage.setItem(SAVE_KEY,JSON.stringify({
        version:6,
        state:{
          turn:state.turn,selectedUnitId:state.selectedUnitId,selectedBarracks:state.selectedBarracks,nextRecruitId:state.nextRecruitId,
          mapZoom:state.mapZoom,mapX:state.mapX,mapY:state.mapY
        },
        teams:teams, units:Object.values(units)
      }));
    }catch(e){}
  }

  function load(){
    try{
      const raw=localStorage.getItem(SAVE_KEY);
      if(!raw)return;
      const s=JSON.parse(raw);
      if(!s||s.version!==6||!Array.isArray(s.units))return;
      state.turn=s.state?.turn||1;
      state.selectedUnitId=s.state?.selectedUnitId||null;
      state.selectedBarracks=s.state?.selectedBarracks||null;
      state.nextRecruitId=s.state?.nextRecruitId||2;
      state.mapZoom=s.state?.mapZoom ?? .52;
      state.mapX=s.state?.mapX ?? 0;
      state.mapY=s.state?.mapY ?? 0;
      for(const k of ['player','enemy']){
        if(s.teams?.[k]){
          teams[k].gold=s.teams[k].gold;
          teams[k].income=100;
          teams[k].recruited=!!s.teams[k].recruited;
        }
      }
      units={};
      s.units.forEach(u=>{ if(u&&u.id)units[u.id]=u; });
      if(!Object.keys(units).length)resetUnits();
    }catch(e){}
  }

  function updateAll(){
    Object.values(units).forEach(u=>{
      const el=ensureUnitEl(u);
      setUnitPos(u);
      el.classList.toggle('selected',u.id===state.selectedUnitId&&!state.selectedBarracks&&u.alive);
      el.classList.toggle('done',u.alive&&u.move===0&&u.attacked);
      el.classList.toggle('dead',!u.alive);
      el.querySelector('.hpFill').style.width=(u.hp/u.maxHp*100)+'%';
      el.querySelector('img').src=spriteFor(u);
    });
    document.getElementById('barracks-player').classList.toggle('selected',state.selectedBarracks==='player');
    document.getElementById('barracks-enemy').classList.toggle('selected',state.selectedBarracks==='enemy');
    document.getElementById('pGold').textContent=teams.player.gold;
    document.getElementById('eGold').textContent=teams.enemy.gold;
    document.getElementById('pCount').textContent=living('player').length;
    document.getElementById('eCount').textContent=living('enemy').length;
    document.getElementById('turnNo').textContent=state.turn;
    document.getElementById('endTurn').disabled=state.busy;
    updateBottomInfo();
    updateHighlights();
    applyMapTransform();
    if(!state.busy)save();
  }

  function clampZoom(z){ return Math.max(.28,Math.min(1.45,z)); }
  function applyMapTransform(){ board.style.transform=`translate(${state.mapX}px,${state.mapY}px) scale(${state.mapZoom})`; }
  function centerMapOn(x,y,zoom=null){
    const r=fieldViewport.getBoundingClientRect();
    if(zoom!==null)state.mapZoom=clampZoom(zoom);
    const px=(x+0.5)*CELL, py=(y+0.5)*CELL;
    state.mapX=r.width/2-px*state.mapZoom;
    state.mapY=r.height/2-py*state.mapZoom;
    applyMapTransform();
  }
  function focusMap(){
    const r=fieldViewport.getBoundingClientRect();
    const portrait=window.matchMedia('(orientation:portrait)').matches;
    const targetZoom=portrait ? Math.min(.62,r.width/(8*CELL)) : Math.min(.78,r.width/(12*CELL));
    centerMapOn(9.5,9.5,targetZoom);
  }
  function zoomMapAt(factor,cx=null,cy=null){
    const r=fieldViewport.getBoundingClientRect();
    if(cx===null){cx=r.width/2;cy=r.height/2}
    const old=state.mapZoom, next=clampZoom(old*factor);
    const mapPointX=(cx-state.mapX)/old, mapPointY=(cy-state.mapY)/old;
    state.mapZoom=next;
    state.mapX=cx-mapPointX*next;
    state.mapY=cy-mapPointY*next;
    applyMapTransform();
  }
  function pointerDistance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
  function pointerCenter(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}

  fieldViewport.addEventListener('pointerdown',e=>{
    if(state.busy)return;
    if(e.target.closest('.unit')||e.target.closest('.barracks')||e.target.closest('#mapControls')||
       e.target.classList.contains('moveCell')||e.target.classList.contains('pathCell')||e.target.classList.contains('attackCell')) return;

    const r=fieldViewport.getBoundingClientRect();
    state.pointers.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
    try{fieldViewport.setPointerCapture(e.pointerId)}catch(e){}

    if(state.pointers.size===2){
      const pts=[...state.pointers.values()];
      const c=pointerCenter(pts[0],pts[1]);
      state.pinching=true; state.dragging=false; state.dragMoved=true;
      state.pinchStartDist=Math.max(20,pointerDistance(pts[0],pts[1]));
      state.pinchStartZoom=state.mapZoom;
      state.pinchMapX=(c.x-state.mapX)/state.mapZoom;
      state.pinchMapY=(c.y-state.mapY)/state.mapZoom;
      fieldViewport.classList.add('dragging');
      return;
    }

    state.dragging=true;
    state.dragMoved=false;
    state.dragStartX=e.clientX;
    state.dragStartY=e.clientY;
    state.mapStartX=state.mapX;
    state.mapStartY=state.mapY;
  });

  fieldViewport.addEventListener('pointermove',e=>{
    if(!state.pointers.has(e.pointerId))return;
    const r=fieldViewport.getBoundingClientRect();
    state.pointers.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});

    if(state.pointers.size>=2){
      const pts=[...state.pointers.values()].slice(0,2);
      const c=pointerCenter(pts[0],pts[1]);
      const dist=Math.max(20,pointerDistance(pts[0],pts[1]));
      state.mapZoom=clampZoom(state.pinchStartZoom*(dist/state.pinchStartDist));
      state.mapX=c.x-state.pinchMapX*state.mapZoom;
      state.mapY=c.y-state.pinchMapY*state.mapZoom;
      state.dragMoved=true;
      fieldViewport.classList.add('dragging');
      applyMapTransform();
      return;
    }

    if(state.dragging){
      const dx=e.clientX-state.dragStartX, dy=e.clientY-state.dragStartY;
      if(Math.hypot(dx,dy)>6){
        state.dragMoved=true;
        fieldViewport.classList.add('dragging');
      }
      if(state.dragMoved){
        state.mapX=state.mapStartX+dx;
        state.mapY=state.mapStartY+dy;
        applyMapTransform();
      }
    }
  });

  function endPointer(e){
    state.pointers.delete(e.pointerId);
    try{fieldViewport.releasePointerCapture(e.pointerId)}catch(err){}
    if(state.pointers.size<2)state.pinching=false;

    if(state.pointers.size===1){
      const p=[...state.pointers.values()][0];
      const r=fieldViewport.getBoundingClientRect();
      state.dragging=true;
      state.dragStartX=p.x+r.left;
      state.dragStartY=p.y+r.top;
      state.mapStartX=state.mapX;
      state.mapStartY=state.mapY;
    }else if(state.pointers.size===0){
      state.dragging=false;
      state.dragMoved=false;
      fieldViewport.classList.remove('dragging');
      save();
    }
  }
  fieldViewport.addEventListener('pointerup',endPointer);
  fieldViewport.addEventListener('pointercancel',endPointer);

  document.getElementById('zoomIn').addEventListener('click',()=>zoomMapAt(1.2));
  document.getElementById('zoomOut').addEventListener('click',()=>zoomMapAt(.83));
  document.getElementById('focusMap').addEventListener('click',focusMap);
  fieldViewport.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=fieldViewport.getBoundingClientRect();
    zoomMapAt(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top);
  },{passive:false});

  document.getElementById('barracks-player').addEventListener('click',e=>{ e.stopPropagation(); selectBarracks('player'); });
  document.getElementById('barracks-enemy').addEventListener('click',e=>{ e.stopPropagation(); selectBarracks('enemy'); });
  document.getElementById('recruitSoldier').addEventListener('click',()=>recruit('player','soldier',true));
  document.getElementById('recruitArcher').addEventListener('click',()=>recruit('player','archer',true));
  document.getElementById('endTurn').addEventListener('click',endTurn);
  document.getElementById('newGame').addEventListener('click',()=>{
    if(confirm('Start a new game?')){
      try{localStorage.removeItem(SAVE_KEY)}catch(e){}
      location.reload();
    }
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  }

  function updateVisibleViewportHeight(){
    const vv=window.visualViewport;
    const visibleHeight=vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height',`${Math.round(visibleHeight)}px`);
  }
  updateVisibleViewportHeight();
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',()=>{
      updateVisibleViewportHeight();
      setTimeout(focusMap,40);
    });
    window.visualViewport.addEventListener('scroll',updateVisibleViewportHeight);
  }

  window.addEventListener('resize',()=>setTimeout(focusMap,60));
  window.addEventListener('orientationchange',()=>setTimeout(focusMap,180));

  positionStaticObjects();
  load();
  updateAll();
  setTimeout(()=>{
    if(state.mapX===0 && state.mapY===0) focusMap();
    else applyMapTransform();
  },80);
})();
</script>
</body>
</html>
