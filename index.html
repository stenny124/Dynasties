<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0b09">
<title>Dynasties — Premium Reference Style v1</title>
<style>
  :root {
    --gold: #d7b67a;
    --cream: #f4e7c7;
    --green: #84d46c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 35%, #352d22 0%, #16120e 48%, #090807 100%);
    font-family: Georgia, "Times New Roman", serif; color: var(--cream);
  }
  #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  #wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage {
    position: relative; width: 1672px; height: 941px; transform-origin:center center;
    border-radius:10px; overflow:hidden; box-shadow:0 28px 80px rgba(0,0,0,.48);
  }
  #bg {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    user-select:none; -webkit-user-drag:none; pointer-events:none;
  }
  .hotspot {
    position:absolute; z-index:12; border:0; padding:0; background:rgba(255,255,255,0.001); cursor:pointer;
  }
  .selectRing {
    position:absolute; z-index:18; pointer-events:none; border-radius:18px; display:none;
  }
  .selectRing.blue {
    border:3px solid rgba(216,246,255,.92);
    box-shadow:0 0 0 4px rgba(38,107,196,.55), 0 0 22px rgba(137,223,255,.72);
  }
  .selectRing.red {
    border:3px solid rgba(255,234,224,.92);
    box-shadow:0 0 0 4px rgba(157,58,43,.58), 0 0 22px rgba(255,183,167,.76);
  }
  .moveTile {
    position:absolute; z-index:10; border:2px solid rgba(192,239,255,.62);
    background:rgba(121,216,255,.20); border-radius:8px; display:none; pointer-events:none;
  }
  .hudPatch {
    position:absolute; z-index:22; pointer-events:none; display:flex; align-items:center; justify-content:flex-start;
    color:#f5e7c6; text-shadow:0 1px 2px rgba(0,0,0,.68); font-variant-numeric: tabular-nums;
  }
  #pFlorins { left:96px; top:58px; width:235px; height:34px; font-size:24px; }
  #pUnits   { left:95px; top:103px; width:155px; height:30px; font-size:28px; }
  #eFlorins { left:1158px; top:58px; width:235px; height:34px; font-size:24px; }
  #eUnits   { left:1158px; top:103px; width:155px; height:30px; font-size:28px; }
  #turnNo   { left:794px; top:23px; width:86px; height:40px; justify-content:center; font-size:28px; color:#2d1c0f; text-shadow:none; font-weight:bold; }

  #selName  { left:119px; top:797px; width:364px; height:40px; font-size:31px; font-weight:600; }
  #selHP    { left:118px; top:847px; width:348px; height:30px; font-size:26px; }
  #selStats { left:116px; top:885px; width:384px; height:28px; font-size:24px; letter-spacing:.2px; }

  #terrainTitle { left:1460px; top:808px; width:175px; height:30px; font-size:29px; }
  #terrainDesc  { left:1460px; top:847px; width:184px; height:56px; font-size:22px; line-height:1.22; align-items:flex-start; white-space:pre-line; }

  #barracksPopup {
    position:absolute; left:352px; top:374px; width:210px; height:210px; z-index:30;
    display:none; pointer-events:none;
  }
  #barracksTitle { left:360px; top:392px; width:188px; height:30px; font-size:25px; z-index:31; display:none; }
  #barracksCost  { left:430px; top:474px; width:96px; height:32px; font-size:26px; z-index:31; display:none; }
  #barracksAction{ left:413px; top:522px; width:112px; height:34px; font-size:23px; z-index:31; justify-content:center; display:none; }

  #toast {
    position:absolute; left:50%; bottom:26px; transform:translateX(-50%); z-index:50;
    min-width:340px; max-width:860px; padding:14px 18px; border-radius:12px;
    background:linear-gradient(180deg, rgba(18,14,12,.94), rgba(6,5,4,.92));
    border:2px solid rgba(209,173,102,.56); box-shadow:0 14px 34px rgba(0,0,0,.38);
    text-align:center; font-size:24px; opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  #toast.show { opacity:1; }

  #helper {
    position:absolute; right:18px; bottom:18px; z-index:60; width:290px; padding:12px 13px;
    border-radius:14px; background:rgba(8,7,6,.74); border:1px solid rgba(201,161,92,.5);
    box-shadow:0 12px 30px rgba(0,0,0,.3); font-size:15px; line-height:1.35; color:#eadbbc;
  }
  #helper b { color:#fff0c7; }
  #titleBubble {
    position:absolute; left:50%; top:12px; transform:translateX(-50%); z-index:60;
    padding:10px 16px; border-radius:999px; background:rgba(8,7,6,.62);
    border:1px solid rgba(214,177,106,.40); font-size:14px; letter-spacing:.3px; color:#eddcbb; text-align:center;
  }
  .gold { color: var(--gold); }
  .green { color: var(--green); }

  @media (max-width: 960px), (max-height: 620px) {
    #helper { width:230px; font-size:12px; padding:9px 10px; }
    #titleBubble { top:8px; font-size:12px; padding:8px 12px; }
    #toast { bottom:12px; min-width:220px; max-width:84vw; font-size:16px; padding:10px 12px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <div id="stage">
      <img id="bg" src="./assets/reference_bg.png" alt="Dynasties premium reference style">

      <div class="moveTile" style="left:286px; top:267px; width:87px; height:77px;"></div>
      <div class="moveTile" style="left:286px; top:347px; width:87px; height:77px;"></div>
      <div class="moveTile" style="left:198px; top:426px; width:87px; height:77px;"></div>
      <div class="moveTile" style="left:286px; top:426px; width:87px; height:77px;"></div>
      <div class="moveTile" style="left:374px; top:426px; width:87px; height:77px;"></div>
      <div class="moveTile" style="left:198px; top:506px; width:87px; height:77px;"></div>
      <div class="moveTile" style="left:286px; top:506px; width:87px; height:77px;"></div>
      <div class="moveTile" style="left:374px; top:506px; width:87px; height:77px;"></div>
      <div class="moveTile" style="left:286px; top:586px; width:87px; height:77px;"></div>

      <div id="roweHeroRing" class="selectRing blue" style="left:249px; top:451px; width:58px; height:110px;"></div>
      <div id="harperHeroRing" class="selectRing red" style="left:1233px; top:496px; width:58px; height:110px;"></div>
      <div id="roweBarracksRing" class="selectRing blue" style="left:180px; top:239px; width:206px; height:248px;"></div>
      <div id="harperBarracksRing" class="selectRing red" style="left:1270px; top:283px; width:240px; height:236px;"></div>

      <img id="barracksPopup" src="./assets/reference_bg.png" alt="">
      <div id="pFlorins" class="hudPatch"></div>
      <div id="pUnits" class="hudPatch"></div>
      <div id="eFlorins" class="hudPatch"></div>
      <div id="eUnits" class="hudPatch"></div>
      <div id="turnNo" class="hudPatch"></div>

      <div id="selName" class="hudPatch"></div>
      <div id="selHP" class="hudPatch"></div>
      <div id="selStats" class="hudPatch"></div>
      <div id="terrainTitle" class="hudPatch"></div>
      <div id="terrainDesc" class="hudPatch"></div>
      <div id="barracksTitle" class="hudPatch"></div>
      <div id="barracksCost" class="hudPatch"></div>
      <div id="barracksAction" class="hudPatch"></div>

      <button class="hotspot" id="roweHero" style="left:236px; top:437px; width:86px; height:138px;"></button>
      <button class="hotspot" id="harperHero" style="left:1221px; top:482px; width:84px; height:142px;"></button>
      <button class="hotspot" id="roweBarracks" style="left:153px; top:224px; width:258px; height:280px;"></button>
      <button class="hotspot" id="harperBarracks" style="left:1247px; top:264px; width:287px; height:276px;"></button>
      <button class="hotspot" id="roweRecruit" style="left:366px; top:515px; width:175px; height:58px;"></button>
      <button class="hotspot" id="endTurn" style="left:756px; top:86px; width:165px; height:78px;"></button>

      <div id="titleBubble">Only using your preferred reference image as the visual target</div>
      <div id="toast"></div>
    </div>
  </div>

  <div id="helper">
    <b>Reference-style shell</b><br>
    • 1 hero per house<br>
    • 300 florins each<br>
    • +100 florins per turn<br>
    • Recruit Soldier at Rowe Barracks for 300<br>
    • Harper auto-recruits when able<br>
    • Tap heroes / barracks / End Turn
  </div>
</div>

<script>
(() => {
  const state = {
    turn: 1,
    player: { florins: 300, units: 1 },
    enemy: { florins: 300, units: 1 },
    selected: 'roweHero'
  };

  const entities = {
    roweHero: {
      name: 'Lord Robert Rowe',
      hp: 'HP 10/10',
      stats: 'Move 3    Range 1    Atk 3    Def 2',
      terrainTitle: 'Grassland',
      terrainDesc: 'Move cost: 1\nNo effect'
    },
    harperHero: {
      name: 'Lady Harper',
      hp: 'HP 10/10',
      stats: 'Move 3    Range 1    Atk 3    Def 2',
      terrainTitle: 'Grassland',
      terrainDesc: 'Move cost: 1\nNo effect'
    },
    roweBarracks: {
      name: 'Barracks (Rowe)',
      hp: 'Recruit Soldier',
      stats: 'Cost 300 florins',
      terrainTitle: 'Keep',
      terrainDesc: 'Recruits basic units\nFriendly structure'
    },
    harperBarracks: {
      name: 'Barracks (Harper)',
      hp: 'Recruit Soldier',
      stats: 'Cost 300 florins',
      terrainTitle: 'Keep',
      terrainDesc: 'Recruits basic units\nEnemy structure'
    }
  };

  const $ = id => document.getElementById(id);
  const toast = $('toast');
  const moveTiles = Array.from(document.querySelectorAll('.moveTile'));

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function setBarracksPopup(show, house='rowe') {
    $('barracksPopup').style.display = show ? 'block' : 'none';
    $('barracksTitle').style.display = show ? 'flex' : 'none';
    $('barracksCost').style.display = show ? 'flex' : 'none';
    $('barracksAction').style.display = show ? 'flex' : 'none';
    $('barracksTitle').textContent = show ? `Barracks (${house === 'rowe' ? 'Rowe' : 'Harper'})` : '';
    $('barracksCost').textContent = show ? '300' : '';
    $('barracksAction').textContent = show ? 'Recruit' : '';
  }

  function render() {
    $('pFlorins').innerHTML = `Florins: <span class="gold">${state.player.florins}</span> <span class="green">(+100/turn)</span>`;
    $('pUnits').textContent = `Units: ${state.player.units}`;
    $('eFlorins').innerHTML = `Florins: <span class="gold">${state.enemy.florins}</span> <span class="green">(+100/turn)</span>`;
    $('eUnits').textContent = `Units: ${state.enemy.units}`;
    $('turnNo').textContent = state.turn;

    $('roweHeroRing').style.display = state.selected === 'roweHero' ? 'block' : 'none';
    $('harperHeroRing').style.display = state.selected === 'harperHero' ? 'block' : 'none';
    $('roweBarracksRing').style.display = state.selected === 'roweBarracks' ? 'block' : 'none';
    $('harperBarracksRing').style.display = state.selected === 'harperBarracks' ? 'block' : 'none';

    moveTiles.forEach(tile => tile.style.display = state.selected === 'roweHero' ? 'block' : 'none');

    const selected = entities[state.selected];
    $('selName').textContent = selected.name;
    $('selHP').textContent = selected.hp;
    $('selStats').textContent = selected.stats;
    $('terrainTitle').textContent = selected.terrainTitle;
    $('terrainDesc').textContent = selected.terrainDesc;

    if(state.selected === 'roweBarracks') {
      setBarracksPopup(true, 'rowe');
    } else if(state.selected === 'harperBarracks') {
      setBarracksPopup(true, 'harper');
    } else {
      setBarracksPopup(false);
    }
  }

  function select(id) {
    state.selected = id;
    render();
  }

  function recruit(side) {
    const house = side === 'player' ? state.player : state.enemy;
    const label = side === 'player' ? 'House Rowe' : 'House Harper';
    if(house.florins < 300) {
      showToast(`${label} needs more florins.`);
      return false;
    }
    house.florins -= 300;
    house.units += 1;
    state.selected = side === 'player' ? 'roweBarracks' : 'harperBarracks';
    render();
    showToast(`${label} recruited a Soldier.`);
    return true;
  }

  function endTurn() {
    state.turn += 1;
    state.player.florins += 100;
    state.enemy.florins += 100;
    render();
    showToast(`Turn ${state.turn} begins. Both houses gain 100 florins.`);
    setTimeout(() => {
      if(state.enemy.florins >= 300) {
        recruit('enemy');
      } else {
        showToast('House Harper holds position.');
      }
    }, 650);
  }

  $('roweHero').addEventListener('click', () => select('roweHero'));
  $('harperHero').addEventListener('click', () => select('harperHero'));
  $('roweBarracks').addEventListener('click', () => select('roweBarracks'));
  $('harperBarracks').addEventListener('click', () => select('harperBarracks'));
  $('roweRecruit').addEventListener('click', e => { e.stopPropagation(); recruit('player'); });
  $('endTurn').addEventListener('click', endTurn);

  function fitStage() {
    const wrap = document.getElementById('wrap');
    const stage = document.getElementById('stage');
    const scale = Math.min(wrap.clientWidth / 1672, wrap.clientHeight / 941);
    stage.style.transform = `scale(${scale})`;
  }

  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', () => setTimeout(fitStage, 120));

  render();
  fitStage();
})();
</script>
</body>
</html>
